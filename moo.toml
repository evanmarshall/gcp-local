[project]
base = "debian:bookworm-20260918-slim"
workdir = "/srv/app"

[recipe]
lockfiles = ["requirements/tools.txt", "requirements/cloud.txt", "requirements/sdk.txt", "requirements/services.txt", "tests/clients/python/requirements.txt", "tests/clients/node/package-lock.json", "toolchains/clients.json", "toolchains/firestore.json", "toolchains/go.json", "toolchains/mysql.json", "toolchains/postgres.json", "toolchains/pubsub.json", "toolchains/quality.json", "toolchains/redis.json", "toolchains/spanner.json", "toolchains/terraform.json", "go.mod", "go.sum", "scripts/install/go.py", "scripts/moo/provision.sh"]

[resources]
cpus = 2
memory = "8GiB"

[network]
# Development HTTP forwarding; run the core with -listen 0.0.0.0:8080.
ports = [8080]

[quiesce]
commands = ["sync"]
