[project]
base = "debian:bookworm-20260918-slim"
workdir = "/srv/app"

[recipe]
lockfiles = ["requirements-tools.txt", "requirements-cloud.txt", "requirements-sdk.txt", "toolchains/go.json", "go.mod", "go.sum", "scripts/install_go.py", "scripts/provision_moo.sh"]

[resources]
cpus = 2
memory = "2GiB"

[network]
# Development HTTP forwarding; run the core with -listen 0.0.0.0:8080.
ports = [8080]

[quiesce]
commands = ["sync"]
