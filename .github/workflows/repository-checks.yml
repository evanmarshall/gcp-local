name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pubsub-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install_go.py
      - run: python3 scripts/install_emulator_jar.py pubsub
      - run: python3 scripts/install_emulator_jar.py firestore
      - run: python3 scripts/install_spanner.py
      - run: python3 scripts/install_redis.py
      - run: python3 scripts/install_postgres.py
      - run: python3 -m venv .venv-tools
      - run: .venv-tools/bin/python -m pip install -r requirements-services.txt
      - run: .venv-tools/bin/python -m pip check
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - run: sh scripts/go.sh build -tags=backendprobe -o bin/pubsub-probe ./tools/pubsub-probe
      - name: Check official emulator protocols and lifecycle without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_pubsub_backend.sh
      - run: sh scripts/go.sh test -c -tags=pubsubintegration -race -o bin/pubsub-integration ./internal/providers/pubsub
      - name: Verify provider IAM, streams, lifecycle, and real Python SDK with local ADC
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_pubsub.sh
      - run: sh scripts/go.sh test -c -tags=firestoreintegration -race -o bin/firestore-integration ./internal/providers/firestore
      - name: Verify Firestore authorization, queries, transactions, and the real Python SDK against the official emulator
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_firestore.sh
      - run: sh scripts/go.sh test -c -tags=spannerintegration -race -o bin/spanner-integration ./internal/providers/spanner
      - name: Verify the Spanner provider against the official emulator without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            sh scripts/check_spanner.sh
      - run: sh scripts/go.sh test -c -tags=redisintegration -race -o bin/redis-integration ./internal/providers/memorystore
      - name: Verify Memorystore against a real Redis without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            sh scripts/check_redis.sh
      - run: sh scripts/go.sh test -c -tags=cloudsqlintegration -race -o bin/cloudsql-integration ./internal/providers/cloudsql
      - name: Verify Cloud SQL against real PostgreSQL behind the connector
        # The servers run as nobody, which must traverse the runner's home.
        run: |
          chmod o+x "$HOME"
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            sh scripts/check_cloudsql.sh
      - run: sh scripts/go.sh test -c -tags=sdkintegration -race -o bin/vertexai-sdk ./internal/providers/vertexai
      - name: Verify Vertex AI with the google-genai SDK and local ADC without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            sh scripts/check_vertexai.sh
      - run: sh scripts/go.sh test -c -tags=sdkintegration -race -o bin/logging-sdk ./internal/providers/logging
      - name: Verify Cloud Logging with the Python SDK over REST and gRPC without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            sh scripts/check_logging.sh
      - name: Compare local REST providers against their recorded contracts
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_rest_recordings.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pubsub-backend
          include-hidden-files: true
          path: |
            .artifacts/pubsub-backend/results.json
            .artifacts/pubsub-provider/results.json
            .artifacts/pubsub-conformance/coverage.json
            .artifacts/pubsub-conformance/junit.xml
            .artifacts/rest-provider/coverage.json

  packaged-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sdk.txt -r requirements-pubsub.txt
      - run: docker compose version
      - name: Verify startup, every packaged service under IAM, isolated reset, docker run, failure, and teardown
        run: python scripts/smoke_environment.py
      - name: Run the Terraform workflow against the packaged environment, then reset and verify it is empty
        run: python scripts/smoke_workflow.py --packaged
      - name: Install the built wheel in a fresh venv and drive its gcp-local CLI
        run: python scripts/smoke_package.py

  workflow-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pubsub.txt
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - run: python scripts/install_go.py
      - run: python scripts/install_emulator_jar.py pubsub
      - run: python scripts/install_terraform.py
      - name: Provision and run the Pub/Sub push to Cloud Run worker to Storage workflow with Terraform
        run: |
          GCP_LOCAL_JAVA=$(readlink -f "$(command -v java)") python scripts/smoke_workflow.py
      - name: Show the core log, including revision output
        if: failure()
        run: tail -n 200 /tmp/gcp-local-core-*.log

  cloudrun-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Deploy a real container through the local Cloud Run control plane
        run: python scripts/smoke_cloudrun.py

  terraform-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/install_go.py
      - run: python scripts/install_terraform.py
      - run: python scripts/install_emulator_jar.py pubsub
      - run: python scripts/install_emulator_jar.py firestore
      - run: python scripts/install_spanner.py
      - run: python scripts/install_redis.py
      - run: python scripts/install_postgres.py
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - name: Warm pinned module and build dependencies before isolation
        run: |
          sh scripts/go.sh -C tests/terraform/runner test -c -o "$PWD/bin/terraform-tests" .
          sh scripts/go.sh build -tags=conformance -o bin/storage-conformance ./tools/storage-conformance
      - name: Run upstream acceptance cases and the metadata negative control without egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_terraform.sh
      - name: Hand private reports back to the artifact uploader
        if: always()
        run: |
          for directory in .artifacts/terraform .artifacts/terraform-fault; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: terraform-acceptance
          include-hidden-files: true
          path: |
            .artifacts/terraform/*.json
            .artifacts/terraform-fault/*.json

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/install_go.py
      - run: sh scripts/check_go.sh
      - name: Exercise runtime and child backends without cloud egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            "$(command -v python)" scripts/run_isolated.py -- \
            sh scripts/go.sh test -race -count=1 -timeout 60s ./internal/...

  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tools.txt
      - run: python scripts/install_go.py
      - run: python scripts/install_quality_tools.py
      - name: Lint Go and Python and reject unbudgeted dead code
        run: python scripts/check_quality.py
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests/tooling -v
      - run: python scripts/check_history.py HEAD

  validation-harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-sdk.txt -r requirements-tools.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-harness-${{ matrix.python }}
          include-hidden-files: true
          path: |
            .artifacts/validation/junit.xml
            .artifacts/validation/coverage.json

  isolated-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv-tools
      - run: .venv-tools/bin/python -m pip install -r requirements-sdk.txt -r requirements-tools.txt
      - run: sudo .venv-tools/bin/python scripts/smoke_isolation.py
      - run: sudo .venv-tools/bin/python scripts/run_isolated.py -- .venv-tools/bin/python -m pytest tests/validation/test_sdk_runner.py -q
      - run: python scripts/install_go.py
      - run: sh scripts/go.sh test -tags=sdkintegration -run '^$' ./internal/identity
      - name: Verify standard ADC and metadata refresh without cloud egress
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GCP_LOCAL_TEST_PYTHON="$PWD/.venv-tools/bin/python" \
            .venv-tools/bin/python scripts/run_isolated.py -- \
            sh scripts/go.sh test -tags=sdkintegration -race -count=1 -timeout 60s ./internal/identity
      - run: python scripts/install_spanner.py
      - run: python scripts/install_redis.py
      - run: python scripts/install_postgres.py
      - run: python scripts/install_emulator_jar.py firestore
      - run: python scripts/install_emulator_jar.py pubsub
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - name: Warm the Storage builds before blocking network egress
        run: |
          sh scripts/go.sh build -o bin/gcp-local ./cmd/gcp-local
          sh scripts/go.sh build -tags=conformance -o bin/storage-conformance ./tools/storage-conformance
      - name: Compare real Storage backend and local ADC against recorded contracts
        run: |
          sudo env GOMODCACHE="$(sh scripts/go.sh env GOMODCACHE)" GOCACHE="$(sh scripts/go.sh env GOCACHE)" \
            GITHUB_SHA="$GITHUB_SHA" GCP_LOCAL_TEST_PYTHON="$PWD/.venv-tools/bin/python" \
            GCP_LOCAL_JAVA=/usr/lib/jvm/java-17-openjdk-amd64/bin/java sh scripts/check_storage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-conformance
          include-hidden-files: true
          path: |
            .artifacts/storage-provider/coverage.json
            .artifacts/storage-provider/junit.xml
