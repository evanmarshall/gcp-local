# Optional override for Cloud Run container execution: mounts the local Docker
# engine socket so the run provider can start revision containers. Container
# execution is opt-in because it grants the core access to the host engine.
services:
  gcp-local:
    command:
      - -listen=0.0.0.0:4566
      - -grpc-listen=0.0.0.0:4567
      - -services=storage,pubsub,run
      - -identity-config=/config/identity.json
      - -iam-config=/config/iam.json
      - -pubsub-java=/usr/bin/java
      - -pubsub-jar=/opt/pubsub/emulator.jar
      - -firestore-java=/usr/bin/java
      - -firestore-jar=/opt/firestore/emulator.jar
      - -run-docker-socket=/var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
