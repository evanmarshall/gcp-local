# Optional override for Cloud Run container execution: mounts the local Docker
# engine socket so the run provider can start revision containers. Container
# execution is opt-in because it grants the core access to the host engine.
# The CLI does not apply it; the packaged default runs the bundled workflow
# worker image as a process inside the core container.
services:
  gcp-local:
    environment:
      GCP_LOCAL_RUN_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
