global
    maxconn 256

defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend local_http
    bind :4566
    default_backend gateway_http

backend gateway_http
    # The core listens on the published host port (see compose.yaml).
    server core "gcp-local:${GCP_LOCAL_PORT}" check

frontend local_grpc
    bind :4567
    default_backend gateway_grpc

backend gateway_grpc
    server core gcp-local:4567 check
