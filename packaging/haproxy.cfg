global
    maxconn 256

defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend local_http
    bind :4566
    default_backend gateway_http

backend gateway_http
    # The core listens on the published host port (see compose.yaml).
    server core "gcp-local:${GCP_LOCAL_PORT}" check

frontend local_grpc
    bind :4567
    default_backend gateway_grpc

backend gateway_grpc
    server core gcp-local:4567 check

# gRPC over TLS passes through as TCP; TLS terminates in the core, which
# holds the environment's server key.
frontend local_grpc_tls
    bind ":${GCP_LOCAL_GRPC_TLS_PORT}"
    default_backend gateway_grpc_tls

backend gateway_grpc_tls
    server core "gcp-local:${GCP_LOCAL_GRPC_TLS_PORT}" check

# Redis and public-IP Cloud SQL instances: each instance's port in the
# data-plane range forwards to the same port on the core. No server port is
# given, so HAProxy keeps the port the client connected to. Protocol
# authentication (Redis AUTH, PostgreSQL passwords) happens in the backends.
frontend local_data
    bind ":${GCP_LOCAL_DATA_PORTS}"
    timeout client 1h
    default_backend core_data

backend core_data
    timeout server 1h
    server core gcp-local
