# The packaged environment. Use the gcp-local CLI (or scripts/dev/local_env.py),
# which supplies every variable below; compose.build.yaml adds the source build.
# The CLI uses this directory as the Compose project directory, in a checkout
# (packaging/) and in an installed wheel (gcp_local/data/) alike.
services:
  gcp-local:
    image: ${GCP_LOCAL_IMAGE:?Use the gcp-local CLI}
    user: "${GCP_LOCAL_UID:?Use the gcp-local CLI}:${GCP_LOCAL_GID:?Use the gcp-local CLI}"
    # The launcher (gcp_local/container.py) execs the core with the packaged
    # service list and backend paths. The core listens on the same port the
    # entry point publishes, so service URIs are valid both on the host and for
    # the push agent and revision processes inside this container.
    command: [serve]
    environment:
      GCP_LOCAL_PORT: ${GCP_LOCAL_PORT:?Use the gcp-local CLI}
      # Redis and public-IP Cloud SQL instances listen on ports from this
      # range; the entry point publishes the same numbers on host loopback.
      GCP_LOCAL_DATA_PORTS: ${GCP_LOCAL_DATA_PORTS:?Use the gcp-local CLI}
      GCP_LOCAL_GRPC_TLS_PORT: ${GCP_LOCAL_GRPC_TLS_PORT:?Use the gcp-local CLI}
    networks: [backend]
    volumes:
      - type: bind
        source: ${GCP_LOCAL_DIRECTORY:?Use the gcp-local CLI}/identity/server.json
        target: /config/identity.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GCP_LOCAL_DIRECTORY:?Use the gcp-local CLI}/iam.json
        target: /config/iam.json
        read_only: true
        bind:
          create_host_path: false
      # The core writes the gRPC TLS CA and server key here on first start;
      # the key never leaves the environment directory.
      - type: bind
        source: ${GCP_LOCAL_DIRECTORY:?Use the gcp-local CLI}/tls
        target: /tls
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, /gcp-local, health, "-endpoint=http://127.0.0.1:${GCP_LOCAL_PORT:?Use the gcp-local CLI}"]
      interval: 1s
      timeout: 4s
      retries: 30
  entrypoint:
    image: haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    user: "65532:65532"
    command: [haproxy, -W, -db, -f, /usr/local/etc/haproxy/haproxy.cfg]
    environment:
      GCP_LOCAL_PORT: ${GCP_LOCAL_PORT:?Use the gcp-local CLI}
      GCP_LOCAL_DATA_PORTS: ${GCP_LOCAL_DATA_PORTS:?Use the gcp-local CLI}
      GCP_LOCAL_GRPC_TLS_PORT: ${GCP_LOCAL_GRPC_TLS_PORT:?Use the gcp-local CLI}
    depends_on:
      gcp-local:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GCP_LOCAL_PORT:?Use the gcp-local CLI}:4566"
      - "127.0.0.1:${GCP_LOCAL_GRPC_PORT:?Use the gcp-local CLI}:4567"
      - "127.0.0.1:${GCP_LOCAL_GRPC_TLS_PORT:?Use the gcp-local CLI}:${GCP_LOCAL_GRPC_TLS_PORT:?Use the gcp-local CLI}"
      - "127.0.0.1:${GCP_LOCAL_DATA_PORTS:?Use the gcp-local CLI}:${GCP_LOCAL_DATA_PORTS:?Use the gcp-local CLI}"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [frontend, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5s
networks:
  frontend: {}
  backend:
    internal: true
