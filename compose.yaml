services:
  gcp-local:
    image: ${GCP_LOCAL_IMAGE:?Use scripts/local_env.py}
    build:
      context: .
      args:
        GCP_LOCAL_VERSION: ${GCP_LOCAL_VERSION:?Use scripts/local_env.py}
    user: "${GCP_LOCAL_UID:?Use scripts/local_env.py}:${GCP_LOCAL_GID:?Use scripts/local_env.py}"
    command:
      - -listen=0.0.0.0:4566
      - -grpc-listen=0.0.0.0:4567
      - -services=storage,pubsub,run
      - -identity-config=/config/identity.json
      - -iam-config=/config/iam.json
      - -pubsub-java=/usr/bin/java
      - -pubsub-jar=/opt/pubsub/emulator.jar
      - -firestore-java=/usr/bin/java
      - -firestore-jar=/opt/firestore/emulator.jar
      - -spanner-emulator=/opt/spanner/emulator_main
      - -spanner-libraries=/opt/spanner/lib
    networks: [backend]
    volumes:
      - type: bind
        source: ${GCP_LOCAL_DIRECTORY:?Use scripts/local_env.py}/identity/server.json
        target: /config/identity.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GCP_LOCAL_DIRECTORY:?Use scripts/local_env.py}/iam.json
        target: /config/iam.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, /gcp-local, health]
      interval: 1s
      timeout: 4s
      retries: 20
  entrypoint:
    image: haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    user: "65532:65532"
    command: [haproxy, -W, -db, -f, /usr/local/etc/haproxy/haproxy.cfg]
    depends_on:
      gcp-local:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GCP_LOCAL_PORT:?Use scripts/local_env.py}:4566"
      - "127.0.0.1:${GCP_LOCAL_GRPC_PORT:?Use scripts/local_env.py}:4567"
    volumes:
      - ./packaging/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [frontend, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5s
networks:
  frontend: {}
  backend:
    internal: true
