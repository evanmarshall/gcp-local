# Strict Python analysis. Ruff runs every rule family except the ones the
# formatter owns and the ones that contradict a deliberate repository decision.
target-version = "py311"
line-length = 100

extend-exclude = [
  ".tools",
  ".venv-tools",
  "third_party",
]

[lint]
select = ["ALL"]
ignore = [
  "COM",   # trailing commas: formatter-owned
  "CPY",   # copyright headers: repository uses a single LICENSE
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
  "ERA",   # commented-out code is often a deliberate park, not an accident
  "ISC",   # implicit string concatenation: formatter-owned
  "Q",     # quotes: formatter-owned
  "TD",    # TODO style: the repository links issues instead
  # Exception messages live at the raise site on purpose. Wrapping every
  # human-readable error in a dedicated exception class would mint hundreds of
  # single-use classes across the emulator and validation harness; the message
  # text itself is the domain contract these checks would move out of sight.
  "TRY003",
  "EM101",
  "EM102",
]

[lint.per-file-ignores]
# Tests assert aggressively, spawn controlled subprocesses, use fixtures
# with framework-mandated signatures, and name tests to describe intent:
# a docstring would restate the test name. INP001 is pytest's package-free
# rootdir convention; PT009/PT018 keep unittest-style and compound assertions;
# PT011 asserts broad failure classes on purpose; ARG keeps fixture and
# parametrize contracts; S105 names synthetic fixture fields, not credentials.
"tests/**" = ["ANN", "ARG", "D", "INP001", "PT011", "S101", "S105", "S106", "SLF001", "T20", "S603", "PT009", "PT018"]
# Testdata is synthetic sample code mirroring SDK shapes, not product source.
"**/testdata/**" = ["ANN", "ARG", "D", "S", "T20", "INP", "PT", "SIM", "ICN", "PLR0915", "PLC0415"]
# The skill scripts and the validation harness are executed as standalone CLIs.
# Smoke scripts assert their own invariants: the assertion failure is the signal.
# They invoke pinned executables (git, docker, terraform) by resolved path on purpose.
# PT017 does not apply: these are standalone programs, not pytest cases.
"scripts/**" = ["INP", "T20", "S101", "S603", "PT017"]
"skills/**" = ["INP", "T20"]
"examples/**" = ["INP", "T20"]
"conftest.py" = ["INP"]
# The vulture whitelist is a declaration file: bare names are undefined loads on purpose.
"quality/vulture-whitelist.py" = ["ALL"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 8
max-positional-args = 8
max-statements = 60
max-branches = 15
allow-magic-value-types = ["bytes", "float", "int", "str"]
