# Strict Go analysis. Every enabled linter is a defect or dead-code detector;
# the disabled list below is limited to rules whose only output is whitespace,
# naming, or layout taste, which gofmt and review already own.
version: "2"

run:
  tests: true

linters:
  default: all
  disable:
    # Layout and naming taste. These produce churn-only diffs and do not find defects.
    - funcorder
    - lll
    - nlreturn
    - tagliatelle
    - varnamelen
    - wsl
    - wsl_v5
    # Structural preferences that conflict with deliberate decisions in this repository.
    - depguard # no dependency allow-list policy exists yet; added deliberately, not silently
    - embeddedstructfieldcheck
    - exhaustruct # protobuf-backed and fixture structs are legitimately sparse
    - exhaustruct_v5
    - gochecknoglobals # sentinel errors and pinned tables are package-level on purpose
    - inamedparam # interface method signatures stay terse
    - mnd # wire codes and protocol bounds are self-describing literals
    - noinlineerr # inline error handling is clearer for guard clauses
    - paralleltest # parallelism is chosen per test; the suite runs under -race
    - testpackage # tests share the package to exercise unexported behavior
    - thelper

  settings:
    cyclop:
      max-complexity: 10
    dupl:
      threshold: 100
    errcheck:
      # Unchecked type assertions can panic a long-lived server, so they are
      # reported. A blank assignment (`_ = f()`) is the language's explicit
      # "deliberately discarded" signal; reporting it leaves no way to record
      # intent and pushes deliberate discards toward silent ignores, so it is
      # left visible as a blank assignment instead.
      check-type-assertions: true
      check-blank: false
    funlen:
      lines: 70
      statements: 45
    gocognit:
      min-complexity: 15
    exhaustive:
      # A default clause here means "the remaining wire codes keep their
      # generic mapping", which is the intent; the switch is over an open enum.
      default-signifies-exhaustive: true
    ireturn:
      # These interfaces are the polymorphism this emulator is built on: a
      # provider registry, the protobuf message surface, and gRPC transports.
      # Returning them is the design, not an abstraction leak.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - proto.Message
        - grpc.ClientConnInterface
        - grpc.ClientStream
        - backend.Backend
        - driver
    gosec:
      excludes:
        - G404 # math/rand is not used for secrets in this emulator
    maintidx:
      under: 20
    nestif:
      min-complexity: 4
    wrapcheck:
      # gRPC status errors carry the wire status the peer must read, and context
      # cancellation/deadline must stay comparable with errors.Is, so wrapping
      # any of these would itself be the defect. Every other returned error is
      # wrapped with diagnostic context.
      ignore-sig-regexps:
        - 'status\.(Error|Errorf)\(c '
        - 'func \(context\.Context\)\.Err\(\) error'
        - 'func \(\*google\.golang\.org/grpc/internal/status\.Status\)\.Err\(\) error'
        - 'func \(google\.golang\.org/grpc\.ServerStream\)\.(RecvMsg|SendMsg)\(m any\) error'
        - 'func \(google\.golang\.org/grpc\.ClientConnInterface\)\.Invoke\(ctx context\.Context'
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-interface-regexps:
        - ^grpc\.ServerStream$
        - ^gateway\.Stream$

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
