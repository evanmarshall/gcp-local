# Python distribution of the gcp-local environment CLI. The runtime itself is
# the Go core inside the Docker image; this package only manages that image
# with Docker Compose. Release automation: .github/workflows/release.yml.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gcp-local"
dynamic = ["version"]
description = "Start, reset, and stop a private local GCP emulator environment with local ADC and IAM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
gcp-local = "gcp_local.environment:main"

[project.urls]
Homepage = "https://github.com/evanmarshall/gcp-local"
Documentation = "https://github.com/evanmarshall/gcp-local/blob/main/docs/guides/quickstart.md"

[tool.hatch.version]
path = "gcp_local/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gcp_local"]

# The CLI starts the published image with the same Compose definition a
# checkout uses; the wheel carries it as package data.
[tool.hatch.build.targets.wheel.force-include]
"packaging/compose.yaml" = "gcp_local/data/compose.yaml"
"packaging/compose.run.yaml" = "gcp_local/data/compose.run.yaml"
"packaging/haproxy.cfg" = "gcp_local/data/haproxy.cfg"

[tool.hatch.build.targets.sdist]
include = [
  "/gcp_local",
  "/packaging/compose.yaml",
  "/packaging/compose.run.yaml",
  "/packaging/haproxy.cfg",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
xfail_strict = true

# Strict Python analysis. Ruff runs every rule family except the ones the
# formatter owns and the ones that contradict a deliberate repository decision.
[tool.ruff]
target-version = "py311"
line-length = 100

extend-exclude = [
  ".tools",
  ".venv-tools",
  "third_party",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM",   # trailing commas: formatter-owned
  "CPY",   # copyright headers: repository uses a single LICENSE
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
  "ERA",   # commented-out code is often a deliberate park, not an accident
  "ISC",   # implicit string concatenation: formatter-owned
  "Q",     # quotes: formatter-owned
  "TD",    # TODO style: the repository links issues instead
  # Exception messages live at the raise site on purpose. Wrapping every
  # human-readable error in a dedicated exception class would mint hundreds of
  # single-use classes across the emulator and validation harness; the message
  # text itself is the domain contract these checks would move out of sight.
  "TRY003",
  "EM101",
  "EM102",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert aggressively, spawn controlled subprocesses, use fixtures
# with framework-mandated signatures, and name tests to describe intent:
# a docstring would restate the test name. INP001 is pytest's package-free
# rootdir convention; PT009/PT018 keep unittest-style and compound assertions;
# PT011 asserts broad failure classes on purpose; ARG keeps fixture and
# parametrize contracts; S105 names synthetic fixture fields, not credentials.
"tests/**" = ["ANN", "ARG", "D", "INP001", "PT011", "S101", "S105", "S106", "SLF001", "T20", "S603", "PT009", "PT018"]
# Testdata is synthetic sample code mirroring SDK shapes, not product source.
"**/testdata/**" = ["ANN", "ARG", "D", "S", "T20", "INP", "PT", "SIM", "ICN", "PLR0915", "PLC0415"]
# The skill scripts and the validation harness are executed as standalone CLIs.
# Smoke scripts assert their own invariants: the assertion failure is the signal.
# They invoke pinned executables (git, docker, terraform) by resolved path on purpose.
# PT017 does not apply: these are standalone programs, not pytest cases.
"scripts/**" = ["INP", "T20", "S101", "S603", "PT017"]
"skills/**" = ["INP", "T20"]
"examples/**" = ["D102", "INP", "S101", "S104", "S310", "T20"]
# The packaged CLI reports its results on stdout like the scripts it replaces.
"gcp_local/environment.py" = ["T20"]
# The vulture whitelist is a declaration file: bare names are undefined loads on purpose.
"quality/vulture-whitelist.py" = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-statements = 60
max-branches = 15
allow-magic-value-types = ["bytes", "float", "int", "str"]

# uv run (the documented repository check) must not install this project.
[tool.uv]
managed = false
